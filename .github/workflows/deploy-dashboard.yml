name: Deploy dashboard to HF Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          echo "=== Configuring git ==="
          git config --global user.email "ramonesimone@users.noreply.github.com"
          git config --global user.name "ramonesimone"

          echo "=== Setting up HF auth ==="
          echo "machine huggingface.co login ramonesimone password $HF_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          echo "=== Pushing app to Space ==="
          cd apps/web
          cat > .gitignore << 'EOF'
node_modules
.next
*.log
EOF
          git init
          git checkout -b main
          git remote add hf https://huggingface.co/spaces/ramonesimone/real-estate-agent
          git add -A
          git commit -m "deploy ${{ github.sha }}"
          git push hf main --force
