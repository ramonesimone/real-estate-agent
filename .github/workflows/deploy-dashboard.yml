name: Deploy dashboard to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd apps/web
          git init
          git config user.email "ramonesimone@users.noreply.github.com"
          git config user.name "ramonesimone"
          git remote add hf https://huggingface.co/spaces/ramonesimone/real-estate-agent
          echo "machine huggingface.co login ramonesimone password $HF_TOKEN" > "$HOME/.netrc"
          git add -A
          git commit -m "deploy ${{ github.sha }}"
          git push hf main --force
