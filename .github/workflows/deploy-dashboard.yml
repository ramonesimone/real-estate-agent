name: Deploy dashboard to HF Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          echo "=== Installing huggingface-hub ==="
          pip install -q huggingface-hub

          echo "=== Logging in to HF ==="
          huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential

          echo "=== Pushing app to Space ==="
          cd apps/web
          git init
          git config user.email "ramonesimone@users.noreply.github.com"
          git config user.name "ramonesimone"
          git remote add hf https://huggingface.co/spaces/ramonesimone/real-estate-agent
          git add -A
          git commit -m "deploy ${{ github.sha }}"
          git push hf main --force
