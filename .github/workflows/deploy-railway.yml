name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          API="https://backboard.railway.com/graphql/v2"
          AUTH="Authorization: Bearer $RAILWAY_API_TOKEN"

          echo "Finding project..."
          PROJECTS=$(curl -s -X POST "$API" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"query":"query { projects { edges { node { id name } } } }"}')
          PID=$(echo "$PROJECTS" | jq -r '.data.projects.edges[0].node.id')
          echo "Project ID: $PID"

          railway up --ci --project "$PID"